version: 2

updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          gradle-minor-patch:
              update-types: [minor, patch]
      ignore:
          # The Paper API pin decides the Minecraft version the plugin is built for, so moving to a new Minecraft
          # version is a deliberate change. New builds of the same version still come through.
          - dependency-name: io.papermc.paper:paper-api
            update-types: [version-update:semver-major, version-update:semver-minor]
          # The SQLite driver is the one Paper ships, which is what the plugin runs on.
          - dependency-name: org.xerial:sqlite-jdbc

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          actions-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-minor-patch:
              update-types: [minor, patch]
