name: Security

on:
    workflow_dispatch: {}
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Repository
              # The whole history, so the scan can walk the pushed range.
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
                      | sudo tar -xz -C /usr/local/bin gitleaks
                  sudo chmod +x /usr/local/bin/gitleaks
                  gitleaks version

            - name: Scan for Secrets in New Commits
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  set -euo pipefail
                  if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                      echo "No base SHA, scanning HEAD commit only"
                      RANGE="--max-count=1 ${HEAD_SHA}"
                  else
                      echo "Scanning range ${BASE_SHA}..${HEAD_SHA}"
                      RANGE="${BASE_SHA}..${HEAD_SHA}"
                  fi
                  gitleaks detect --source . --no-banner --verbose --log-opts="${RANGE}"

    trivy:
        name: Trivy
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7.0.1

            - name: Install Trivy
              run: |
                  curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz \
                      | sudo tar -xz -C /usr/local/bin trivy
                  sudo chmod +x /usr/local/bin/trivy
                  trivy --version

            - name: Scan Filesystem
              run: |
                  trivy fs . \
                      --scanners vuln,misconfig \
                      --severity HIGH,CRITICAL \
                      --ignore-unfixed \
                      --exit-code 1 \
                      --skip-dirs build \
                      --skip-dirs .gradle
